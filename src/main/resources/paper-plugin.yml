name: Lifeline
version: '${version}'
main: com.lifeline.Lifeline
api-version: '1.21'
description: A 2-player co-op plugin with Shared Waypoints, Shared Vault, and a Downed/Revive System.
authors:
  - LifelineDev
dependencies:
  server:
    Geyser-Spigot:
      load: BEFORE
      required: false

permissions:
  lifeline.use:
    description: Allows using general Lifeline co-op features.
    default: true
  lifeline.node:
    description: Allows access to the shared waypoints (nodes) system.
    default: true
  lifeline.waypoint:
    description: Legacy alias for lifeline.node.
    default: true
  lifeline.stash:
    description: Allows access to the shared co-op stash / safe.
    default: true
  lifeline.safe:
    description: Alias for lifeline.stash.
    default: true
  lifeline.vault:
    description: Legacy alias for lifeline.stash.
    default: true
  lifeline.pstash:
    description: Allows access to personal stash storage.
    default: true
  lifeline.personalstash:
    description: Alias for lifeline.pstash.
    default: true
  lifeline.stashp:
    description: Alias for lifeline.pstash.
    default: true
  lifeline.pst:
    description: Alias for lifeline.pstash.
    default: true
  lifeline.mystash:
    description: Alias for lifeline.pstash.
    default: true
  lifeline.mywp:
    description: Allows access to personal waypoints.
    default: true
  lifeline.personalwaypoint:
    description: Alias for lifeline.mywp.
    default: true
  lifeline.personalwaypoints:
    description: Alias for lifeline.mywp.
    default: true
  lifeline.pwaypoints:
    description: Alias for lifeline.mywp.
    default: true
  lifeline.lfnode:
    description: Alias for lifeline.mywp.
    default: true
  lifeline.tpq:
    description: Allows sending and accepting player-to-player teleport requests.
    default: true
  lifeline.tether:
    description: Alias for lifeline.tpq.
    default: true
  lifeline.revive:
    description: Allows reviving downed teammates and checking own revives.
    default: true
  lifeline.radar:
    description: Allows toggling and viewing the teammate actionbar radar.
    default: true
  lifeline.admin:
    description: Allows reloading configuration and managing other players' revives.
    default: op
